name: Veille scientifique Mau Plan

on:
  schedule:
    - cron: "0 6 * * 5"   # chaque vendredi 6h UTC = 6h Abidjan (GitHub lance souvent avec retard)
  workflow_dispatch:       # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

# Hebdo et mensuel écrivent dans le même dépôt : jamais en même temps.
concurrency:
  group: veille-depot
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Lancer la veille
        id: veille
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python veille.py

      - name: Enregistrer le rapport dans le dépôt
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add reports data
          git commit -m "Veille du $(date +%F)" || echo "Rien de nouveau"
          git pull --rebase origin main
          git push

      # Le rapport est enregistré quand même, mais le run passe en rouge
      # (et GitHub envoie un e-mail) si une source principale a lâché.
      - name: Alerte si la veille est dégradée
        if: steps.veille.outputs.degraded == 'true'
        run: |
          echo "::error::Veille incomplète — ${{ steps.veille.outputs.reason }}"
          exit 1
